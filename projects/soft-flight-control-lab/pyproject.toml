[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softflight-control-lab"
version = "0.1.0"
description = "Deterministic benchmark for online residual control of a planar soft aerial robot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tisa Selma"}]
dependencies = []

[project.scripts]
softflight-benchmark = "softflight_control_lab.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
