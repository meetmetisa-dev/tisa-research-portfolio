[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tisa-research-portfolio"
version = "1.0.0"
description = "Dependency-free reproducible prototypes for trustworthy AI in networked multimedia"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tisa Selma"}]
dependencies = []

[project.scripts]
qoe-repro = "tisa_portfolio.qoe_repro:main"
cipherqoe = "tisa_portfolio.cipherqoe:main"
fedqoe = "tisa_portfolio.fedqoe:main"
trustflow = "tisa_portfolio.trustflow:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
